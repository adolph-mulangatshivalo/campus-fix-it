<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="theme-color" content="#22C55E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Fix-It</title>






    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/img/logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="theme-worker">

    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            Campus Fix-It
        </a>
        <div class="navbar-links" id="nav-links"></div>
    </nav>

    <!-- Flash Messages container -->
    <div class="flash-messages" id="flash-messages"></div>
                
            
        
    </div>

    <!-- Main Content Area -->
    <main class="container">
        
<div class="responsive-header">
    <h2>Maintenance Team Dashboard</h2>
    <div>
        <span style="font-weight: 600; color: var(--text-muted);">Welcome, <span id="worker-name">Worker</span></span>
    </div>
</div>

<div class="dashboard-stats">
    <div class="stat-card" style="background: #FFF; border: var(--border-width) solid var(--border-color); padding: 1.5rem; box-shadow: var(--neo-shadow);">
        <h3 style="margin-bottom: 0.5rem; color: var(--text-muted); font-size: 1rem;">Total Assigned</h3>
        <div style="font-size: 2.5rem; font-weight: 800;" id="total-assigned"><div class="skeleton skeleton-text" style="height: 2.5rem; width: 60px; margin: 0 auto;"></div></div>
    </div>
    
    <div class="stat-card" style="background: #FEF08A; border: var(--border-width) solid var(--border-color); padding: 1.5rem; box-shadow: var(--neo-shadow);">
        <h3 style="margin-bottom: 0.5rem; color: var(--text-muted); font-size: 1rem;">In Progress</h3>
        <div style="font-size: 2.5rem; font-weight: 800;" id="in-progress"><div class="skeleton skeleton-text" style="height: 2.5rem; width: 60px; margin: 0 auto;"></div></div>
    </div>
    
    <div class="stat-card" style="background: #BBF7D0; border: var(--border-width) solid var(--border-color); padding: 1.5rem; box-shadow: var(--neo-shadow);">
        <h3 style="margin-bottom: 0.5rem; color: var(--text-muted); font-size: 1rem;">Fixed</h3>
        <div style="font-size: 2.5rem; font-weight: 800;" id="fixed"><div class="skeleton skeleton-text" style="height: 2.5rem; width: 60px; margin: 0 auto;"></div></div>
    </div>
</div>

<div class="table-container" style="background: #FFF; border: var(--border-width) solid var(--border-color); box-shadow: var(--neo-shadow);">
    <div style="padding: 1.5rem; border-bottom: 2px solid var(--border-color); background: #F9FAFB;">
        <h3 style="margin: 0;">My Assigned Tasks</h3>
    </div>
    
    <table class="table">
        <thead>
            <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Status</th>
                <th>Date Assigned</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tasks-table-body">
            <tr>
                <td data-label="Title"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text" style="width: 60%;"></div></td>
                <td data-label="Category"><div class="skeleton skeleton-text" style="width: 80%;"></div></td>
                <td data-label="Status"><div class="skeleton skeleton-text" style="width: 80px; height: 1.5rem; border-radius: 20px;"></div></td>
                <td data-label="Date Assigned"><div class="skeleton skeleton-text" style="width: 100px;"></div></td>
                <td data-label="Action"><div class="skeleton skeleton-text" style="height: 2.2rem; width: 120px;"></div></td>
            </tr>
            <tr>
                <td data-label="Title"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text" style="width: 60%;"></div></td>
                <td data-label="Category"><div class="skeleton skeleton-text" style="width: 80%;"></div></td>
                <td data-label="Status"><div class="skeleton skeleton-text" style="width: 80px; height: 1.5rem; border-radius: 20px;"></div></td>
                <td data-label="Date Assigned"><div class="skeleton skeleton-text" style="width: 100px;"></div></td>
                <td data-label="Action"><div class="skeleton skeleton-text" style="height: 2.2rem; width: 120px;"></div></td>
            </tr>
        </tbody>
    </table>
</div>

    </main>

    <!-- Firebase Serverless Scripts -->
    <script type="module" src="/static/js/firebase-config.js"></script>
    <script type="module" src="/static/js/main.js"></script>
    <script type="module">
        import { auth, db } from '/static/js/firebase-config.js';
        import { collection, query, where, getDocs, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        let unsubscribeReports = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Get worker's name
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists()) {
                    document.getElementById('worker-name').textContent = userDoc.data().full_name;
                }
                
                try {
                    const q = query(collection(db, "reports"), where("assigned_worker_id", "==", user.uid));
                    if (unsubscribeReports) unsubscribeReports();
                    unsubscribeReports = onSnapshot(q, (querySnapshot) => {
                        const tbody = document.getElementById('tasks-table-body');
                        
                        let total = 0;
                        let inProgress = 0;
                        let fixed = 0;
                        
                        const reports = [];
                        querySnapshot.forEach((d) => {
                            reports.push({ id: d.id, ...d.data() });
                            total++;
                            const status = d.data().status || '';
                            if (status === 'In Progress' || status === 'Assigned' || status === 'Under Review') inProgress++;
                            if (status === 'Fixed') fixed++;
                        });
                        
                        document.getElementById('total-assigned').textContent = total;
                        document.getElementById('in-progress').textContent = inProgress;
                        document.getElementById('fixed').textContent = fixed;
                        
                        // Sort descending by created_at
                        reports.sort((a, b) => {
                            const timeA = a.created_at ? a.created_at.toMillis() : 0;
                            const timeB = b.created_at ? b.created_at.toMillis() : 0;
                            return timeB - timeA;
                        });
                        
                        if (reports.length === 0) {
                            tbody.innerHTML = `
                            <tr>
                                <td colspan="5" style="text-align: center; padding: 3rem; color: var(--text-muted);">
                                    You have no assigned tasks at the moment.
                                </td>
                            </tr>`;
                            return;
                        }
                        
                        tbody.innerHTML = '';
                        reports.forEach(report => {
                            const dateObj = report.created_at ? report.created_at.toDate() : new Date();
                            const dateStr = dateObj.toLocaleDateString();
                            
                            const st = report.status || 'Submitted';
                            const badgeClass = st.toLowerCase().replace(' ', '-');
                            
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td data-label="Title"><strong>${report.title}</strong></td>
                                <td data-label="Category">${report.category}</td>
                                <td data-label="Status">
                                    <span class="badge badge-${badgeClass}">${st}</span>
                                </td>
                                <td data-label="Date Assigned">${dateStr}</td>
                                <td data-label="Action">
                                    <a href="/worker/manage_report.html?id=${report.id}" class="action-btn btn-blue">View Task</a>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    });
                        
                    } catch(error) {
                        console.error("Error fetching reports: ", error);
                        document.getElementById('tasks-table-body').innerHTML = `
                            <tr>
                                <td colspan="5" style="text-align: center; color: red; padding: 3rem;">
                                    Error loading tasks: ${error.message}
                                </td>
                            </tr>`;
                    }
            }
        });
    </script>
</body>
</html>
