<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Fix-It</title>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/img/logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="theme-student">

    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            Campus Fix-It
        </a>
        <div class="navbar-links" id="nav-links"></div>
    </nav>

    <!-- Flash Messages container -->
    <div class="flash-messages" id="flash-messages"></div>
                
            
        
    </div>

    <!-- Main Content Area -->
    <main class="container">
        
<div class="auth-container">
    
    <!-- Role Tabs -->
    <div style="display: flex; margin-bottom: 2rem; border-bottom: 1px solid var(--border);">
        <button id="tab-student" onclick="setRole('student')" style="flex: 1; padding: 1rem; background: none; border: none; border-bottom: 3px solid transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 1rem;">Student</button>
        <button id="tab-worker" onclick="setRole('worker')" style="flex: 1; padding: 1rem; background: none; border: none; border-bottom: 3px solid transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 1rem;">Worker</button>
        <button id="tab-admin" onclick="setRole('admin')" style="flex: 1; padding: 1rem; background: none; border: none; border-bottom: 3px solid transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 1rem;">Admin</button>
    </div>

    <h2 id="form-title" class="auth-title" style="margin-bottom: 1.5rem;">
        Admin Login
        Worker Login
        Student Login
    </h2>
    
    <form method="POST" action="/auth/login.html" autocomplete="off">
        <input type="hidden" name="login_role" id="login_role" value="">
        <div class="form-group">
            <label for="login_id" id="email_label" class="form-label">
                Admin ID
                Worker ID
                Student Number
            </label>
            <input type="text" id="login_id" name="login_id" class="form-control" placeholder="e.g. 25019587" autocomplete="nope" required>
        </div>
        
        <div class="form-group">
            <label for="login_pass" class="form-label">Password</label>
            <div style="position: relative;">
                <input type="password" id="login_pass" name="login_pass" class="form-control" placeholder="Enter your password" autocomplete="new-password" required style="padding-right: 3.5rem;">
                <button type="button" onclick="const x = document.getElementById('login_pass'); const isPass = x.type === 'password'; x.type = isPass ? 'text' : 'password'; this.querySelector('.eye-open').style.display = isPass ? 'none' : 'block'; this.querySelector('.eye-closed').style.display = isPass ? 'block' : 'none';" style="position: absolute; right: 0; top: 0; height: 100%; width: 3.5rem; background: #E5E7EB; border: none; border-left: var(--border-width) solid var(--border-color); cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; transition: background 0.15s ease;" onmouseover="this.style.background='#D1D5DB'" onmouseout="this.style.background='#E5E7EB'">
                    <svg class="eye-open" style="display: block;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c0-6 4-9 8-9s8 3 8 9"></path><circle cx="12" cy="14" r="3"></circle></svg>
                    <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c0-6 4-9 8-9s8 3 8 9"></path><circle cx="12" cy="14" r="3"></circle><line x1="3" y1="3" x2="21" y2="21"></line></svg>
                </button>
            </div>
            <div style="text-align: right; margin-top: 0.5rem;">
                <a href="/auth/forgot_password.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 700; border-bottom: 2px solid transparent; transition: var(--transition);" onmouseover="this.style.borderBottomColor='#000'; this.style.color='#000'" onmouseout="this.style.borderBottomColor='transparent'; this.style.color='var(--text-muted)'">Forgot Password?</a>
            </div>
        </div>
        
        <button type="submit" class="btn btn-blue" id="submit-btn" style="width: 100%;">
            Sign In as Admin
            Sign In as Worker
            Sign In as Student
        </button>
    </form>
    
    <div class="auth-links" id="register-link" style="display: none;">
        Don't have an account? <a href="/auth/register.html">Register here</a>
    </div>
</div>

<script type="module">
    import { auth, db } from '/static/js/firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    window.setRole = function(role) {
        // Update the theme globally
        document.body.className = 'theme-' + role;
        
        // Update hidden input
        document.getElementById('login_role').value = role;
        
        const tabStudent = document.getElementById('tab-student');
        const tabAdmin = document.getElementById('tab-admin');
        const tabWorker = document.getElementById('tab-worker');
        const title = document.getElementById('form-title');
        const emailLabel = document.getElementById('email_label');
        const emailInput = document.getElementById('login_id');
        const btn = document.getElementById('submit-btn');
        const regLink = document.getElementById('register-link');
        const navReg = document.getElementById('nav-register');
        
        tabStudent.style.borderBottomColor = 'transparent';
        tabStudent.style.color = 'var(--text-muted)';
        tabAdmin.style.borderBottomColor = 'transparent';
        tabAdmin.style.color = 'var(--text-muted)';
        tabWorker.style.borderBottomColor = 'transparent';
        tabWorker.style.color = 'var(--text-muted)';
        
        if (role === 'admin') {
            tabAdmin.style.borderBottomColor = 'var(--primary)';
            tabAdmin.style.color = 'var(--primary)';
            title.textContent = 'Admin Login';
            emailLabel.textContent = 'Admin ID';
            emailInput.placeholder = 'e.g. ADM111';
            btn.textContent = 'Sign In as Admin';
            btn.className = 'btn btn-green';
            regLink.style.display = 'none'; // Admins can't register here
            if (navReg) navReg.style.display = 'none';
        } else if (role === 'worker') {
            tabWorker.style.borderBottomColor = 'var(--primary)';
            tabWorker.style.color = 'var(--primary)';
            title.textContent = 'Worker Login';
            emailLabel.textContent = 'Worker ID';
            emailInput.placeholder = 'e.g. WOR111';
            btn.textContent = 'Sign In as Worker';
            btn.className = 'btn btn-yellow';
            regLink.style.display = 'none'; // Workers can't register here
            if (navReg) navReg.style.display = 'none';
        } else {
            tabStudent.style.borderBottomColor = 'var(--primary)';
            tabStudent.style.color = 'var(--primary)';
            title.textContent = 'Student Login';
            emailLabel.textContent = 'Student Number';
            emailInput.placeholder = 'e.g. 25019587';
            btn.textContent = 'Sign In as Student';
            btn.className = 'btn btn-blue';
            regLink.style.display = 'block';
            if (navReg) navReg.style.display = 'inline-block';
        }
        
        emailInput.oninput = function(e) {
            if (role === 'student') {
                let val = this.value;
                if (!val.includes('@')) {
                    val = val.replace(/\D/g, ''); // strip non-digits
                    if (val.length > 8) {
                        val = val.substring(0, 8);
                    }
                    this.value = val;
                }
            } else if (role === 'admin' || role === 'worker') {
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.toUpperCase();
                this.setSelectionRange(start, end);
            }
        };
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        setRole('student');
        
        const form = document.querySelector('form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const role = document.getElementById('login_role').value;
            let email = document.getElementById('login_id').value.trim().toLowerCase();
            const password = document.getElementById('login_pass').value;
            
            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            try {
                let authEmail = email;
                
                if (role === 'student' && /^\d{8}$/.test(email)) {
                    // Look up the personal email using student number
                    const usersRef = collection(db, "users");
                    const q = query(usersRef, where("student_number", "==", email));
                    const querySnapshot = await getDocs(q);
                    
                    if (querySnapshot.empty) {
                        throw new Error("Student Number not found in database.");
                    }
                    
                    const userData = querySnapshot.docs[0].data();
                    if (!userData.email || !userData.email.includes('@')) {
                        throw new Error("No valid personal email linked to this account.");
                    }
                    
                    authEmail = userData.email;
                } else if ((role === 'admin' || role === 'worker') && !email.includes('@')) {
                    if (email === 'SADM111' || email === 'sadm111') {
                        authEmail = 'sadm111@admin.campus-fix-it.com';
                    } else {
                        // Look up the personal email or dummy email using staff_id
                        const usersRef = collection(db, "users");
                        const q = query(usersRef, where("staff_id", "==", email.toUpperCase()));
                        const querySnapshot = await getDocs(q);
                        
                        if (querySnapshot.empty) {
                            throw new Error("Staff ID not found in database.");
                        }
                        
                        const userData = querySnapshot.docs[0].data();
                        if (!userData.email || !userData.email.includes('@')) {
                            throw new Error("No valid email linked to this staff account.");
                        }
                        
                        authEmail = userData.email;
                    }
                }

                const userCredential = await signInWithEmailAndPassword(auth, authEmail, password);
                
                // Verify role
                const docSnap = await getDoc(doc(db, 'users', userCredential.user.uid));
                if (docSnap.exists()) {
                    const actualRole = docSnap.data().role;
                    if (actualRole !== role) {
                        throw new Error(`Invalid role. You are registered as a ${actualRole}.`);
                    }
                    window.location.href = `/${actualRole}/dashboard.html`;
                } else {
                    if (role === 'student') {
                        window.location.href = '/student/dashboard.html';
                    } else {
                        throw new Error('Account missing role data.');
                    }
                }
            } catch(error) {
                console.error(error);
                let cleanMsg = error.message.replace(/Firebase:\s*/, '').replace(/\s*\(.*?\)\.?/, '').trim();
                if (cleanMsg === 'Error' || cleanMsg === 'invalid credential') {
                    cleanMsg = 'Invalid ID or password. Please try again.';
                }
                const flash = document.getElementById('flash-messages');
                flash.innerHTML = `<div class="flash-message flash-danger">${cleanMsg}</div>`;
                btn.disabled = false;
                btn.textContent = `Sign In as ${role.charAt(0).toUpperCase() + role.slice(1)}`;
            }
        });
    });
</script>

    </main>


    <!-- Firebase Serverless Scripts -->
    <script type="module" src="/static/js/firebase-config.js"></script>
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
