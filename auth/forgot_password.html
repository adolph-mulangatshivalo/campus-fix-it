<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Campus Fix-It</title>






    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/img/logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="theme-reset">
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            Campus Fix-It
        </a>
        <div class="navbar-links" id="nav-links"></div>
    </nav>

    <div class="flash-messages" id="flash-messages"></div>

    <main class="container">
        <div class="auth-container">
            <h2 class="auth-title" style="margin-bottom: 1.5rem;">Reset Password</h2>
            
            <!-- STEP 1: Request OTP -->
            <div id="step-1">
                <p style="margin-bottom: 1.5rem; text-align: center; font-weight: 500; font-size: 0.95rem;">
                    Enter your Student No / Worker ID / Admin ID, and the Personal Email linked to it to receive an OTP code.
                </p>
                <form id="request-otp-form" autocomplete="off">
                    <div class="form-group">
                        <label for="login_id" class="form-label">Student No / Worker ID / Admin ID</label>
                        <input type="text" id="login_id" name="login_id" class="form-control" placeholder="e.g. 25019587, WOR111, ADM111" autocomplete="nope" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="personal_email" class="form-label">Linked Personal Email</label>
                        <input type="email" id="personal_email" name="personal_email" class="form-control" placeholder="e.g. yourname@gmail.com" autocomplete="nope" required>
                    </div>
                    
                    <button type="submit" class="btn btn-blue" id="send-otp-btn" style="width: 100%;">
                        Send OTP Code
                    </button>
                </form>
            </div>

            <!-- STEP 2: Verify OTP and Reset -->
            <div id="step-2" style="display: none;">
                <p style="margin-bottom: 1.5rem; text-align: center; font-weight: 500; font-size: 0.95rem; color: var(--secondary);">
                    An OTP code has been sent to your email. Please enter it below along with your new password.
                    <br><strong id="otp-timer-text" style="color: var(--primary-color);">Time remaining: <span id="otp-timer">02:00</span></strong>
                </p>
                <form id="verify-otp-form" autocomplete="off">
                    <div class="form-group">
                        <label for="otp_code" class="form-label">6-Digit OTP Code</label>
                        <input type="text" id="otp_code" name="otp_code" class="form-control" placeholder="e.g. 123456" autocomplete="nope" required maxlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="new_password" class="form-label">New Password</label>
                        <div style="position: relative;">
                            <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Enter new password" autocomplete="new-password" required style="padding-right: 3.5rem;">
                            <button type="button" onclick="const x = document.getElementById('new_password'); const isPass = x.type === 'password'; x.type = isPass ? 'text' : 'password'; this.querySelector('.eye-open').style.display = isPass ? 'none' : 'block'; this.querySelector('.eye-closed').style.display = isPass ? 'block' : 'none';" style="position: absolute; right: 0; top: 0; height: 100%; width: 3.5rem; background: #E5E7EB; border: none; border-left: var(--border-width) solid var(--border-color); cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; transition: background 0.15s ease;" onmouseover="this.style.background='#D1D5DB'" onmouseout="this.style.background='#E5E7EB'">
                                <svg class="eye-open" style="display: block;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c0-6 4-9 8-9s8 3 8 9"></path><circle cx="12" cy="14" r="3"></circle></svg>
                                <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c0-6 4-9 8-9s8 3 8 9"></path><circle cx="12" cy="14" r="3"></circle><line x1="3" y1="3" x2="21" y2="21"></line></svg>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-blue" id="reset-pwd-btn" style="width: 100%;">
                        Reset Password
                    </button>
                </form>
            </div>
            
            <div class="auth-links">
                Remembered your password? <a href="/auth/login.html">Log in here</a>
            </div>
        </div>
    </main>



    <!-- Firebase Serverless Scripts -->
    <script type="module" src="/static/js/firebase-config.js"></script>
    <script type="module" src="/static/js/main.js"></script>
    <script type="module">
        import { db } from '/static/js/firebase-config.js';
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        let verifiedTargetEmail = null;
        let otpTimerInterval = null;

        function startOtpTimer() {
            let timeLeft = 120; // 2 minutes
            const timerDisplay = document.getElementById('otp-timer');
            const timerText = document.getElementById('otp-timer-text');
            const flash = document.getElementById('flash-messages');
            
            clearInterval(otpTimerInterval);
            timerDisplay.textContent = '02:00';
            timerText.style.color = 'var(--primary-color)';

            otpTimerInterval = setInterval(async () => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `${m}:${s}`;

                if (timeLeft <= 30) {
                    timerText.style.color = 'red';
                }

                if (timeLeft <= 0) {
                    clearInterval(otpTimerInterval);
                    timerDisplay.textContent = '00:00';
                    
                    // Self-destruct the code!
                    try {
                        await fetch('/api/cleanupOtp', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: verifiedTargetEmail })
                        });
                    } catch (e) {
                        console.error('Cleanup failed', e);
                    }

                    // Reset UI
                    document.getElementById('step-2').style.display = 'none';
                    document.getElementById('step-1').style.display = 'block';
                    flash.innerHTML = `<div class="flash-message flash-danger">Your OTP has expired and was securely deleted. Please request a new one.</div>`;
                }
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            const requestForm = document.getElementById('request-otp-form');
            const verifyForm = document.getElementById('verify-otp-form');
            const flash = document.getElementById('flash-messages');

            // STEP 1: Request OTP
            requestForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const btn = document.getElementById('send-otp-btn');
                let id = document.getElementById('login_id').value.trim().toLowerCase();
                let personalEmail = document.getElementById('personal_email').value.trim().toLowerCase();
                
                btn.disabled = true;
                btn.textContent = 'Verifying...';
                
                try {
                    verifiedTargetEmail = personalEmail;
                    
                    // Verify Student ID against DB
                    if (/^\d{8}$/.test(id)) {
                        const usersRef = collection(db, "users");
                        const q = query(usersRef, where("student_number", "==", id), where("email", "==", personalEmail));
                        const querySnapshot = await getDocs(q);
                        
                        if (querySnapshot.empty) {
                            throw new Error("This Personal Email is not linked to this Student Number.");
                        }
                    } else {
                        // Admin/Worker formatting
                        if (id === 'sadm111' || id === 'SADM111') {
                            verifiedTargetEmail = 'sadm111@admin.campus-fix-it.com';
                        } else {
                            const usersRef = collection(db, "users");
                            const q = query(usersRef, where("staff_id", "==", id.toUpperCase()));
                            const querySnapshot = await getDocs(q);
                            
                            if (querySnapshot.empty) {
                                throw new Error("Staff ID not found in database.");
                            }
                            
                            const userData = querySnapshot.docs[0].data();
                            
                            if (!userData.email || userData.email.includes('@no-email.campusfixit.com')) {
                                throw new Error("No personal email on file. Please see an Admin to reset your password.");
                            }
                            
                            if (userData.email !== personalEmail) {
                                throw new Error("This Personal Email does not match our records for this Staff ID.");
                            }
                            
                            verifiedTargetEmail = userData.email;
                        }
                    }
                    
                    btn.textContent = 'Generating & Sending OTP...';
                    
                    // Call the secure Vercel backend to generate OTP, save to DB, and send email
                    const response = await fetch('/api/sendOtp', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email: verifiedTargetEmail })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to send OTP.');
                    }

                    // Switch UI
                    flash.innerHTML = `<div class="flash-message flash-success" style="background: #4ADE80;">OTP Sent successfully!</div>`;
                    step1.style.display = 'none';
                    step2.style.display = 'block';
                    
                    startOtpTimer();

                } catch(error) {
                    console.error(error);
                    flash.innerHTML = `<div class="flash-message flash-danger">${error.message || 'An error occurred'}</div>`;
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Send OTP Code';
                }
            });

            // STEP 2: Verify OTP & Reset
            verifyForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const btn = document.getElementById('reset-pwd-btn');
                const otp = document.getElementById('otp_code').value.trim();
                const newPassword = document.getElementById('new_password').value;
                
                btn.disabled = true;
                btn.textContent = 'Updating Password...';
                
                try {
                    // Send to our Vercel Serverless Function
                    const response = await fetch('/api/resetPassword', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: verifiedTargetEmail,
                            otp: otp,
                            newPassword: newPassword
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to reset password');
                    }

                    flash.innerHTML = `<div class="flash-message flash-success" style="background: #4ADE80;">Password updated successfully! You can now log in.</div>`;
                    
                    clearInterval(otpTimerInterval);

                    // Redirect to login after a short delay
                    setTimeout(() => {
                        window.location.href = '/auth/login.html';
                    }, 2000);

                } catch(error) {
                    console.error(error);
                    flash.innerHTML = `<div class="flash-message flash-danger">${error.message}</div>`;
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Reset Password';
                }
            });
        });
    </script>
</body>
</html>
