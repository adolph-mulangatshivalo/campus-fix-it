<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Fix-It</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/img/logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="theme-student">

    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            Campus Fix-It
        </a>
        <div class="navbar-links" id="nav-links"></div>
    </nav>

    <!-- Flash Messages container -->
    <div class="flash-messages" id="flash-messages"></div>
                
            
        
    </div>

    <!-- Main Content Area -->
    <main class="container">
        
<div class="auth-container">
    <h2 id="form-title" class="auth-title" style="margin-bottom: 1.5rem;">Student Registration</h2>
    
    <form method="POST" action="/auth/register.html" autocomplete="off">
        <div class="form-group">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Enter your full name" autocomplete="off" required>
        </div>
        
        <div class="form-group">
            <label for="student_number" class="form-label">Student Number</label>
            <input type="text" id="student_number" name="student_number" class="form-control" placeholder="e.g. 25011674" required autocomplete="off" oninput="let val = this.value.replace(/\D/g, ''); if (val.length > 8) val = val.substring(0, 8); this.value = val; document.getElementById('email').value = val ? val + '@mvula.univen.ac.za' : ''">
        </div>
        
        <div class="form-group">
            <label for="email" class="form-label">University Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="e.g. 25011674@mvula.univen.ac.za" pattern=".*@mvula\.univen\.ac\.za$" title="Must be your @mvula.univen.ac.za email" autocomplete="nope" required>
        </div>
        
        <div class="form-group">
            <label for="personal_email" class="form-label">Personal Email</label>
            <input type="email" id="personal_email" name="personal_email" class="form-control" placeholder="e.g. yourname@gmail.com" autocomplete="nope" required>
        </div>
        
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div style="position: relative;">
                <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" autocomplete="new-password" required style="padding-right: 3.5rem;">
                <button type="button" onclick="const x = this.previousElementSibling; const isPass = x.type === 'password'; x.type = isPass ? 'text' : 'password'; this.querySelector('.eye-open').style.display = isPass ? 'none' : 'block'; this.querySelector('.eye-closed').style.display = isPass ? 'block' : 'none';" style="position: absolute; right: 0; top: 0; height: 100%; width: 3.5rem; background: #E5E7EB; border: none; border-left: var(--border-width) solid var(--border-color); cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; transition: background 0.15s ease;" onmouseover="this.style.background='#D1D5DB'" onmouseout="this.style.background='#E5E7EB'">
                    <svg class="eye-open" style="display: block;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c0-6 4-9 8-9s8 3 8 9"></path><circle cx="12" cy="14" r="3"></circle></svg>
                    <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c0-6 4-9 8-9s8 3 8 9"></path><circle cx="12" cy="14" r="3"></circle><line x1="3" y1="3" x2="21" y2="21"></line></svg>
                </button>
            </div>
        </div>
        
        <div class="form-group">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <div style="position: relative;">
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm your password" autocomplete="new-password" required style="padding-right: 3.5rem;">
                <button type="button" onclick="const x = this.previousElementSibling; const isPass = x.type === 'password'; x.type = isPass ? 'text' : 'password'; this.querySelector('.eye-open').style.display = isPass ? 'none' : 'block'; this.querySelector('.eye-closed').style.display = isPass ? 'block' : 'none';" style="position: absolute; right: 0; top: 0; height: 100%; width: 3.5rem; background: #E5E7EB; border: none; border-left: var(--border-width) solid var(--border-color); cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; transition: background 0.15s ease;" onmouseover="this.style.background='#D1D5DB'" onmouseout="this.style.background='#E5E7EB'">
                    <svg class="eye-open" style="display: block;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c0-6 4-9 8-9s8 3 8 9"></path><circle cx="12" cy="14" r="3"></circle></svg>
                    <svg class="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c0-6 4-9 8-9s8 3 8 9"></path><circle cx="12" cy="14" r="3"></circle><line x1="3" y1="3" x2="21" y2="21"></line></svg>
                </button>
            </div>
        </div>
        
        <button type="submit" class="btn btn-blue" style="width: 100%;">Create Account</button>
    </form>
    
    <div class="auth-links">
        Already have an account? <a href="/auth/login.html">Log in here</a>
    </div>
</div>

    </main>


    <!-- Firebase Serverless Scripts -->
    <script type="module" src="/static/js/firebase-config.js"></script>
    <script type="module" src="/static/js/main.js"></script>
    <script type="module">
        import { auth, db } from '/static/js/firebase-config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const btn = form.querySelector('button[type="submit"]');
                const fullName = document.getElementById('full_name').value.trim();
                const studentNumber = document.getElementById('student_number').value.trim();
                const email = document.getElementById('email').value.trim();
                const personalEmail = document.getElementById('personal_email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm_password').value;
                
                const flash = document.getElementById('flash-messages');
                
                if (password !== confirmPassword) {
                    flash.innerHTML = `<div class="flash-message flash-danger">Passwords do not match.</div>`;
                    return;
                }
                
                btn.disabled = true;
                btn.textContent = 'Creating Account...';
                
                try {
                    // Create Firebase Auth account using Personal Email
                    const userCredential = await createUserWithEmailAndPassword(auth, personalEmail, password);
                    const user = userCredential.user;
                    
                    // Create user document in Firestore
                    await setDoc(doc(db, 'users', user.uid), {
                        full_name: fullName,
                        student_number: studentNumber,
                        email: personalEmail,
                        university_email: email,
                        role: 'student',
                        created_at: new Date()
                    });
                    
                    window.location.href = '/student/dashboard.html';
                } catch(error) {
                    console.error(error);
                    let cleanMsg = error.message.replace(/Firebase:\s*/, '').replace(/\s*\(.*?\)\.?/, '').trim();
                    if (cleanMsg === 'Error' || cleanMsg === 'invalid credential') {
                        cleanMsg = 'An error occurred during registration. Please try again.';
                    } else if (error.message.includes('email-already-in-use')) {
                        cleanMsg = 'An account with this student number already exists.';
                    }
                    flash.innerHTML = `<div class="flash-message flash-danger">${cleanMsg}</div>`;
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                }
            });
        });
    </script>
</body>
</html>
