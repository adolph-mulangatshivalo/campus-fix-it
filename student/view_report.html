<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Fix-It</title>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/img/logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="theme-student">

    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            Campus Fix-It
        </a>
        <div class="navbar-links" id="nav-links"></div>
    </nav>

    <!-- Flash Messages container -->
    <div class="flash-messages" id="flash-messages"></div>
                
            
        
    </div>

    <!-- Main Content Area -->
    <main class="container">
        
<div style="margin-bottom: 1.5rem;">
    <a href="/student/dashboard.html" style="color: var(--text-muted); text-decoration: none; font-weight: 700;">&larr; Back to Dashboard</a>
</div>

<div class="table-container" style="padding: 2rem;" id="report-container">
    <div class="responsive-header" style="align-items: flex-start; margin-bottom: 2rem;">
        <div>
            <div class="skeleton skeleton-text" style="height: 2.5rem; width: 300px; margin-bottom: 0.5rem;"></div>
            <div class="skeleton skeleton-text" style="height: 1rem; width: 150px;"></div>
        </div>
        <div>
            <div class="skeleton skeleton-text" style="height: 2rem; width: 120px; border-radius: 20px;"></div>
        </div>
    </div>
    
    <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 2rem;">
    
    <div class="responsive-split-grid">
        <div>
            <h4 style="margin-bottom: 0.5rem; text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 0.5rem;">Description</h4>
            <div class="skeleton" style="height: 100px; border: var(--border-width) solid var(--border-color); margin-bottom: 2rem; box-shadow: var(--neo-shadow);"></div>
            
            <h4 style="margin-bottom: 0.5rem; text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 0.5rem;">Assigned Maintenance Worker</h4>
            <div class="skeleton skeleton-text" style="height: 1.5rem; width: 150px; margin-bottom: 2rem;"></div>
            
            <h4 style="margin-bottom: 0.5rem; text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 0.5rem;">Location</h4>
            <div class="skeleton skeleton-text" style="height: 1.5rem; width: 200px; margin-bottom: 2rem;"></div>
        </div>
        
        <div style="background: #FFF; padding: 1.5rem; border: var(--border-width) solid var(--border-color); box-shadow: var(--neo-shadow);">
            <h4 style="margin-bottom: 1.5rem; text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 0.5rem;">Status Updates</h4>
            <div class="skeleton skeleton-text" style="height: 4rem; margin-bottom: 1rem;"></div>
            <div class="skeleton skeleton-text" style="height: 4rem;"></div>
        </div>
    </div>
</div>

    </main>

    <!-- Firebase Serverless Scripts -->
    <script type="module" src="/static/js/firebase-config.js"></script>
    <script type="module" src="/static/js/main.js"></script>
    <script type="module">
        import { auth, db } from '/static/js/firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const reportId = urlParams.get('id');
            const container = document.getElementById('report-container');
            
            if (!reportId) {
                container.innerHTML = `<div style="text-align: center; padding: 3rem; color: red;">No report ID provided.</div>`;
                return;
            }
            
            try {
                const docRef = doc(db, 'reports', reportId);
                const docSnap = await getDoc(docRef);
                
                if (!docSnap.exists()) {
                    container.innerHTML = `<div style="text-align: center; padding: 3rem; color: red;">Report not found.</div>`;
                    return;
                }
                
                const report = docSnap.data();
                const dateObj = report.created_at ? report.created_at.toDate() : new Date();
                
                const currentReport = report;
                const st = currentReport.status || 'Submitted';
                const badgeClass = st.toLowerCase().replace(' ', '-');
                
                let workerName = "Not Assigned Yet";
                if (report.assigned_worker_id) {
                    const workerDoc = await getDoc(doc(db, 'users', report.assigned_worker_id));
                    if (workerDoc.exists()) {
                        workerName = workerDoc.data().full_name;
                    }
                }
                
                let imageHtml = '';
                if (report.image_url) {
                    imageHtml = `
                    <div style="margin-bottom: 2rem;">
                        <h4 style="margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;">Attached Image</h4>
                        <img src="${report.image_url}" alt="Issue Photo" style="width: 100%; max-width: 800px; height: auto; border: var(--border-width) solid var(--border-color); box-shadow: var(--neo-shadow); margin-top: 1rem; border-radius: 4px;">
                    </div>`;
                }
                
                let notesHtml = '';
                if (report.notes && report.notes.length > 0) {
                    notesHtml = '<div style="display: flex; flex-direction: column; gap: 1.5rem;">';
                    report.notes.forEach(note => {
                        const nDate = note.timestamp ? note.timestamp.toDate().toLocaleString() : '';
                        notesHtml += `
                        <div style="border-left: 4px solid var(--primary); padding-left: 1rem;">
                            <div style="font-size: 0.85rem; font-weight: 700; color: #000;">${nDate}</div>
                            <div style="font-weight: 800; font-size: 1rem; margin-top: 0.25rem;">
                                Status changed to: <span class="badge badge-${(note.new_status || 'Submitted').toLowerCase().replace(' ', '-')}">${note.new_status}</span>
                            </div>
                            ${note.text ? `
                            <div style="font-size: 0.95rem; font-weight: 500; color: #333; margin-top: 0.5rem; background: #FEF08A; padding: 0.5rem; border: 2px solid #000;">
                                "${note.text}"
                            </div>` : ''}
                            <div style="font-size: 0.8rem; font-weight: 700; color: #000; margin-top: 0.5rem; text-align: right;">
                                - ${note.author_name} (${note.author_role})
                            </div>
                        </div>`;
                    });
                    notesHtml += '</div>';
                } else {
                    notesHtml = '<p style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600;">No updates yet. Your report has been submitted and is awaiting review.</p>';
                }
                
                container.innerHTML = `
                    <div class="responsive-header" style="align-items: flex-start; margin-bottom: 2rem;">
                        <div>
                            <h2 style="margin-bottom: 0.5rem;">${report.title}</h2>
                            <div style="color: var(--text-muted); font-size: 0.9rem;">
                                Reported on ${dateObj.toLocaleDateString()} &bull; ${report.category}
                            </div>
                        </div>
                        <div>
                            <span class="badge badge-${badgeClass}" style="font-size: 1rem; padding: 0.5rem 1rem;">
                                ${st}
                            </span>
                        </div>
                    </div>
                    
                    <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 2rem;">
                    
                    <div class="responsive-split-grid">
                        <div>
                            <h4 style="margin-bottom: 0.5rem; text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 0.5rem;">Description</h4>
                            <p style="background: #FFF; border: var(--border-width) solid var(--border-color); padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--neo-shadow); font-weight: 500; white-space: pre-wrap;">${report.description}</p>
                            
                            <h4 style="margin-bottom: 0.5rem; text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 0.5rem;">Assigned Maintenance Worker</h4>
                            <p style="margin-bottom: 2rem; font-weight: 500;"><span style="background: var(--primary); color: #fff; padding: 0.25rem 0.5rem;">${workerName}</span></p>
                            
                            <h4 style="margin-bottom: 0.5rem; text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 0.5rem;">Location</h4>
                            <p style="margin-bottom: 2rem; font-weight: 500;">${report.location}</p>
                            
                            ${imageHtml}
                        </div>
                        
                        <div style="background: #FFF; padding: 1.5rem; border: var(--border-width) solid var(--border-color); box-shadow: var(--neo-shadow);">
                            <h4 style="margin-bottom: 1.5rem; text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 0.5rem;">Status Updates</h4>
                            ${notesHtml}
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div style="text-align: center; padding: 3rem; color: red;">Error loading report: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
